services:
  web:
    build:
      context: .
      target: builder        # dev uses the builder stage, not nginx
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules    # don't overwrite container's node_modules
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json