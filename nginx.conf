server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files and fall back to index.html for SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic caching and gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/html;
  expires 1d;
}
